function renderSuggestions() {
  const el = document.getElementById("suggestions");
  el.innerHTML = "";
  let picks;
  if (!firstSuggestionsDone) {
    picks = FIXED_SUGGESTIONS;
  } else {
    const avail = FOLLOWUP_SUGGESTIONS.filter(s => !usedFollowups.has(s.q));
    picks = avail.sort(() => Math.random() - 0.5).slice(0, 3);
  }
  picks.forEach(s => {

    btn.className = "suggestion-btn";

    btn.onclick = () => {

      el.innerHTML = "";

function makeBotAvatar(mini) {
  const av = document.createElement("div");
  av.className = mini ? "mini-avatar" : "header-avatar";
  av.innerHTML = AVATAR_SVG;
  return av;
}

function makeUserAvatar() {
  const av = document.createElement("div");
  av.className = "mini-avatar user-av";
  av.textContent = "U";
  return av;
}

function formatBotText(text) {
  const paras = text.split(/\n\n+/);
  return paras.map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

function addMessage(role, text) {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const av = role === "bot" ? makeBotAvatar(true) : makeUserAvatar();
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = role === "bot" ? formatBotText(text) : text.replace(/\n/g, "<br>");
  if (role === "bot") { wrap.appendChild(av); wrap.appendChild(bubble); }
  else { wrap.appendChild(bubble); wrap.appendChild(av); }
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg bot"; wrap.id = "typing-indicator";
  wrap.appendChild(makeBotAvatar(true));
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}
