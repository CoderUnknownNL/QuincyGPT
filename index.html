<style>

    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: #faf8f4;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .msg { display: flex; gap: 10px; }
  .msg.user { flex-direction: row-reverse; }

  .mini-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    align-self: flex-end;
    border: 1.5px solid var(--border);
    background: var(--screen-bg);
  }
  .mini-avatar svg { width: 100%; height: 100%; }
  .mini-avatar.user-av {
    background: var(--bubble-user-bg);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; font-weight: 600; color: #fff;
    border-color: var(--accent);
  }

  .bubble {
    max-width: 78%;
    padding: 0.8rem 1rem;
    font-size: 14px;
    line-height: 1.7;
    border-radius: 2px;
  }
  .msg.bot .bubble {
    background: #fff;
    color: #1a7a1a;
    border: 1px solid #b0d0b0;
    border-left: 3px solid var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    border-radius: 0 4px 4px 4px;
  }
  .msg.bot .bubble p { margin-bottom: 0.55em; }
  .msg.bot .bubble p:last-child { margin-bottom: 0; }
  .msg.bot .bubble ul { padding-left: 1.2em; margin: 0.3em 0; }
  .msg.bot .bubble li { margin-bottom: 0.2em; color: #148a14; }
  .msg.user .bubble {
    background: var(--bubble-user-bg);
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    border-radius: 4px 0 4px 4px;
  }

  .typing { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 1px;
    animation: blink 1.1s infinite;
  }

  .typing span:nth-child(3) { animation-delay: 0.4s; }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0 1.25rem 0.4rem;
    flex-shrink: 0;

    gap: 7px;
    flex-shrink: 0;
    background: #faf8f4;

    border-radius: 2px;
    padding: 5px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.1s;
    box-shadow: 2px 2px 0 var(--border);
  }
  .suggestion-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 2px 2px 0 #1a30cc;
  }

    padding: 0.75rem 1.25rem;
    border-top: 1.5px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
    flex-shrink: 0;
  }
  .prompt {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    font-weight: 600;
    padding-bottom: 8px;
    flex-shrink: 0;

    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--mono);
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 100px;
    overflow-y: auto;
    color: var(--text);
    background: #fff;

  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 2px;
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 3px 3px 0 #1a30cc;
    transition: all 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #1a30cc; }
  .send-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #1a30cc; }

  /* Contact bar */
  .contact-bar {
    background: var(--panel);
    border-top: 1.5px solid var(--border);
    padding: 0.6rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;

    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
    letter-spacing: 0.5px;

  .contact-btn {
    background: #e8e4dc;
    color: #555048;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 2px 2px 0 var(--border);
    transition: all 0.1s;
    letter-spacing: 0.5px;

  .contact-btn:hover { background: var(--beige-light); color: #333; }
  .contact-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--border); }

  /* Footer */
  .footer {
    background: #e8e4dc;
    padding: 4px 1.25rem;
    display: flex;
    justify-content: space-between;
    border-top: 2px solid var(--border);
    flex-shrink: 0;
  }
  .footer span {
    font-family: var(--mono);
    font-size: 9px;
    color: #888070;
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    body { padding: 0; }
    .chat-wrapper { height: 100vh; border-radius: 0; box-shadow: none; }
  }
</style>
</head>

let usedFollowups = new Set();
let history = [];
let firstSuggestionsDone = false;

function renderSuggestions() {
  const el = document.getElementById("suggestions");
  el.innerHTML = "";
  let picks = !firstSuggestionsDone ? FIXED_SUGGESTIONS :
    FOLLOWUP_SUGGESTIONS.filter(s => !usedFollowups.has(s.q)).sort(() => Math.random() - 0.5).slice(0, 3);
  picks.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "suggestion-btn";
    btn.textContent = s.label;
    btn.onclick = () => { usedFollowups.add(s.q); firstSuggestionsDone = true; el.innerHTML = ""; submitMessage(s.q); };
    el.appendChild(btn);
  });
}

function makeBotAvatar(mini) {
  const av = document.createElement("div");
  av.className = mini ? "mini-avatar" : "header-avatar";
  av.innerHTML = AVATAR_SVG;
  return av;
}

function makeUserAvatar() {
  const av = document.createElement("div");
  av.className = "mini-avatar user-av";
  av.textContent = "U";
  return av;
}

function formatBotText(text) {
  return text.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return "";
    const lines = p.split("\n");
    if (lines.some(l => l.match(/^[-•*]\s/))) {
      const items = lines.filter(l => l.match(/^[-•*]\s/)).map(l => `<li>${l.replace(/^[-•*]\s/, "")}</li>`).join("");
      return `<ul>${items}</ul>`;
    }
    return `<p>${p.replace(/\n/g, "<br>")}</p>`;
  }).join("");
}

function addMessage(role, text) {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const av = role === "bot" ? makeBotAvatar(true) : makeUserAvatar();
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = role === "bot" ? formatBotText(text) : text.replace(/\n/g, "<br>");
  if (role === "bot") { wrap.appendChild(av); wrap.appendChild(bubble); }
  else { wrap.appendChild(bubble); wrap.appendChild(av); }
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg bot"; wrap.id = "typing-indicator";
  wrap.appendChild(makeBotAvatar(true));
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

async function submitMessage(text) {
  if (!text.trim()) return;
  firstSuggestionsDone = true;
  addMessage("user", text);
  history.push({ role: "user", content: text });
  addTyping();
  document.getElementById("userInput").value = "";
  document.getElementById("userInput").style.height = "auto";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
  "Content-Type": "application/json",
},
      body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: SYSTEM_PROMPT, messages: history })
    });
    const data = await res.json();
    removeTyping();
    const reply = data?.content?.[0]?.text || "Er ging iets mis. Probeer het opnieuw.";
    addMessage("bot", reply);
    history.push({ role: "assistant", content: reply });
    renderSuggestions();
  } catch(e) {
    removeTyping();
    addMessage("bot", "Verbindingsfout. Controleer of de API-sleutel correct is ingesteld.");
  }
}

function sendMessage() {
  const val = document.getElementById("userInput").value.trim();
  if (val) submitMessage(val);
}

document.getElementById("userInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 100) + "px";
});
